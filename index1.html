<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Resume Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body { height: 100%; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: #e8ecf1;
    color: #1e293b;
    overflow: hidden;
  }
  
  /* ============ TOP HEADER ============ */
  .app-header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    padding: 0 24px;
    color: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10;
  }
  
  .app-header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .header-actions { display: flex; gap: 10px; }
  
  .btn {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  
  .btn-primary { background: #10b981; color: white; }
  .btn-primary:hover { background: #059669; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary { background: rgba(255,255,255,0.15); color: white; }
  .btn-secondary:hover { background: rgba(255,255,255,0.25); }
  
  /* ============ SPLIT LAYOUT ============ */
  .main-layout {
    display: grid;
    grid-template-columns: 420px 1fr;
    height: calc(100vh - 64px);
    gap: 0;
  }
  
  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .panel { display: none; }
    .panel.mobile-show { display: block; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; z-index: 5; }
  }
  
  /* ============ LEFT: FORM PANEL ============ */
  .panel {
    background: #fff;
    overflow-y: auto;
    padding: 24px;
    border-right: 1px solid #e2e8f0;
  }
  
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-track { background: #f1f5f9; }
  .panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .panel::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #64748b;
    margin-bottom: 12px;
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .section-label:first-child { margin-top: 0; }
  
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }
  
  .templates-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  
  .template-btn {
    padding: 9px 3px;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 9.5px;
    font-weight: 700;
    transition: all 0.15s;
    text-align: center;
    color: #64748b;
    line-height: 1.3;
    font-family: inherit;
    user-select: none;
  }
  
  .template-btn:hover { border-color: #10b981; color: #10b981; }
  .template-btn.active {
    background: #10b981;
    color: white;
    border-color: #10b981;
    transform: scale(1.04);
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
  }
  
  .form-group { margin-bottom: 13px; }
  
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 5px;
    color: #475569;
  }
  
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.15s;
    background: #f8fafc;
    color: #1e293b;
  }
  
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #10b981;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
  }
  
  .form-group textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
  
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  /* ============ RIGHT: PREVIEW PANEL ============ */
  .preview-area {
    background: #d8dee7;
    overflow: auto;
    padding: 30px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .preview-area::-webkit-scrollbar { width: 10px; height: 10px; }
  .preview-area::-webkit-scrollbar-track { background: #cbd5e1; }
  .preview-area::-webkit-scrollbar-thumb { background: #64748b; border-radius: 5px; }
  .preview-area::-webkit-scrollbar-thumb:hover { background: #475569; }
  
  #resumePreview {
    width: 210mm;
    min-height: 297mm;
    background: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  
  /* ============ RESUME BASE ============ */
  .resume {
    width: 210mm;
    min-height: 297mm;
    background: white;
    color: #1e293b;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    line-height: 1.55;
    position: relative;
    overflow: hidden;
  }
  
  .resume .r-name { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 4px; }
  .resume .r-role { font-size: 13px; font-weight: 500; letter-spacing: 0.5px; }
  .resume .r-section { margin-bottom: 18px; }
  .resume .r-section-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    padding-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .resume .r-section-title::after {
    content: '';
    flex: 1;
    height: 1.5px;
    background: currentColor;
    opacity: 0.3;
  }
  .resume p { margin-bottom: 6px; }
  .resume ul { padding-left: 18px; margin: 4px 0; }
  .resume li { margin-bottom: 3px; padding-left: 2px; }
  .resume li::marker { color: currentColor; }
  
  /* TEMPLATE 1: EXECUTIVE NAVY */
  .t1 { padding: 0; }
  .t1 .t1-header { background: #0f172a; color: white; padding: 42px 50px 34px; }
  .t1 .r-name { color: white; font-size: 34px; }
  .t1 .r-role { color: #94a3b8; margin-bottom: 14px; }
  .t1 .t1-contact { color: #cbd5e1; font-size: 11px; }
  .t1 .t1-body { padding: 34px 50px; }
  .t1 .r-section-title { color: #0f172a; }
  .t1 .skill-item { display: inline-block; padding: 3px 10px; background: #f1f5f9; border-radius: 4px; margin: 3px 3px 3px 0; font-size: 11px; font-weight: 500; }
  
  /* TEMPLATE 2: MODERN BLUE */
  .t2 { padding: 0; }
  .t2 .t2-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; padding: 40px 50px; }
  .t2 .r-name { color: white; }
  .t2 .r-role { color: #bfdbfe; }
  .t2 .t2-contact { margin-top: 12px; color: #dbeafe; font-size: 11px; }
  .t2 .t2-body { padding: 34px 50px; }
  .t2 .r-section-title { color: #1e40af; border-bottom: 2px solid #dbeafe; padding-bottom: 8px; }
  .t2 .r-section-title::after { display: none; }
  .t2 .skill-item { display: inline-block; padding: 4px 11px; background: #dbeafe; color: #1e40af; border-radius: 14px; margin: 3px 4px 3px 0; font-size: 11px; font-weight: 600; }
  
  /* TEMPLATE 3: ELEGANT SERIF */
  .t3 { padding: 50px; font-family: 'Merriweather', serif; }
  .t3 .t3-head { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px double #334155; }
  .t3 .r-name { font-family: 'Merriweather', serif; font-weight: 900; font-size: 32px; color: #0f172a; }
  .t3 .r-role { color: #64748b; font-style: italic; margin: 4px 0 10px; font-size: 13px; }
  .t3 .t3-contact { color: #475569; font-size: 11px; }
  .t3 .r-section-title { color: #0f172a; font-family: 'Merriweather', serif; font-weight: 900; letter-spacing: 2px; }
  .t3 .skill-item { font-family: 'Inter'; display: inline-block; padding: 3px 10px; border: 1px solid #cbd5e1; border-radius: 3px; margin: 3px 4px 3px 0; font-size: 11px; }
  
  /* TEMPLATE 4: SIDEBAR PRO */
  .t4 { display: flex; padding: 0; min-height: 297mm; }
  .t4 .t4-side { width: 33%; background: #1e293b; color: #e2e8f0; padding: 40px 26px; }
  .t4 .t4-main { width: 67%; padding: 40px 34px; }
  .t4 .r-name { color: white; font-size: 24px; line-height: 1.15; }
  .t4 .r-role { color: #10b981; font-weight: 600; font-size: 12px; margin-top: 6px; }
  .t4 .t4-side .r-section-title { color: #10b981; font-size: 11px; }
  .t4 .t4-side .r-section-title::after { background: #10b981; opacity: 0.3; }
  .t4 .t4-side p, .t4 .t4-side li { font-size: 11px; }
  .t4 .t4-contact-line { font-size: 11px; margin-bottom: 8px; word-break: break-word; color: #cbd5e1; }
  .t4 .t4-main .r-section-title { color: #1e293b; }
  .t4 .skill-item { display: inline-block; padding: 3px 9px; background: rgba(16,185,129,0.15); color: #34d399; border-radius: 4px; margin: 3px 3px 3px 0; font-size: 10.5px; font-weight: 500; }
  
  /* TEMPLATE 5: CRIMSON */
  .t5 { padding: 0; }
  .t5 .t5-header { background: #fff; padding: 40px 50px 20px; border-bottom: 3px solid #dc2626; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .t5 .r-name { color: #991b1b; font-size: 32px; }
  .t5 .r-role { color: #dc2626; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 11px; margin-top: 4px; }
  .t5 .t5-contact-box { text-align: right; font-size: 11px; color: #475569; line-height: 1.8; }
  .t5 .t5-body { padding: 28px 50px 34px; }
  .t5 .r-section-title { color: #dc2626; }
  .t5 .skill-item { display: inline-block; padding: 3px 10px; background: #fee2e2; color: #991b1b; border-radius: 4px; margin: 3px 3px 3px 0; font-size: 11px; font-weight: 500; }
  
  /* TEMPLATE 6: VIOLET GRADIENT */
  .t6 { padding: 0; }
  .t6 .t6-header { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #ec4899 100%); color: white; padding: 44px 50px; text-align: center; }
  .t6 .r-name { color: white; font-size: 34px; }
  .t6 .r-role { color: rgba(255,255,255,0.92); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; font-size: 11px; margin: 6px 0 14px; }
  .t6 .t6-contact { color: rgba(255,255,255,0.9); font-size: 11px; }
  .t6 .t6-body { padding: 34px 50px; }
  .t6 .r-section-title { color: #7c3aed; }
  .t6 .skill-item { display: inline-block; padding: 4px 12px; background: linear-gradient(135deg, #ede9fe, #fce7f3); color: #6d28d9; border-radius: 14px; margin: 3px 4px 3px 0; font-size: 11px; font-weight: 600; }
  
  /* TEMPLATE 7: MINIMAL MONO */
  .t7 { padding: 55px 55px; }
  .t7 .r-name { font-weight: 300; font-size: 38px; letter-spacing: 2px; color: #0f172a; }
  .t7 .r-role { color: #64748b; text-transform: uppercase; letter-spacing: 4px; font-size: 10.5px; margin-top: 6px; font-weight: 500; }
  .t7 .t7-contact { margin: 14px 0 26px; padding-bottom: 22px; border-bottom: 1px solid #cbd5e1; font-size: 11px; color: #475569; }
  .t7 .r-section-title { color: #0f172a; font-weight: 500; letter-spacing: 4px; font-size: 11px; }
  .t7 .r-section-title::after { display: none; }
  .t7 .r-section { margin-bottom: 24px; }
  .t7 .skill-item { display: inline-block; padding: 3px 0; margin-right: 14px; font-size: 11px; font-weight: 500; color: #334155; border-bottom: 1px dotted #94a3b8; }
  
  /* TEMPLATE 8: AMBER CREATIVE */
  .t8 { padding: 0; }
  .t8 .t8-header { background: #f59e0b; padding: 40px 50px; color: #451a03; position: relative; overflow: hidden; }
  .t8 .r-name { color: #451a03; position: relative; font-size: 32px; }
  .t8 .r-role { color: #78350f; font-weight: 600; position: relative; margin-top: 4px; }
  .t8 .t8-contact { color: #451a03; font-size: 11px; margin-top: 12px; position: relative; }
  .t8 .t8-body { padding: 34px 50px; }
  .t8 .r-section-title { color: #b45309; }
  .t8 .skill-item { display: inline-block; padding: 3px 10px; background: #fef3c7; color: #92400e; border-radius: 4px; margin: 3px 3px 3px 0; font-size: 11px; font-weight: 600; }
  
  /* TEMPLATE 9: TEAL PROFESSIONAL */
  .t9 { padding: 0; }
  .t9 .t9-header { background: #0d9488; color: white; padding: 36px 50px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .t9 .r-name { color: white; font-size: 30px; }
  .t9 .r-role { color: #99f6e4; margin-top: 4px; }
  .t9 .t9-contact { text-align: right; font-size: 11px; color: #ccfbf1; line-height: 1.9; }
  .t9 .t9-body { padding: 30px 50px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .t9 .t9-full { grid-column: 1 / -1; }
  .t9 .r-section-title { color: #0d9488; }
  .t9 .skill-item { display: inline-block; padding: 3px 9px; background: #ccfbf1; color: #115e59; border-radius: 4px; margin: 3px 3px 3px 0; font-size: 10.5px; font-weight: 600; }
  
  /* TEMPLATE 10: BOLD MONOCHROME */
  .t10 { padding: 0; }
  .t10 .t10-header { padding: 45px 50px 30px; border-bottom: 4px solid #000; }
  .t10 .r-name { font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; line-height: 1; color: #000; }
  .t10 .r-role { display: inline-block; background: #000; color: white; padding: 5px 14px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 3px; margin-top: 14px; font-weight: 700; }
  .t10 .t10-contact { margin-top: 16px; font-size: 11px; color: #333; }
  .t10 .t10-body { padding: 32px 50px; }
  .t10 .r-section-title { color: #000; font-weight: 900; }
  .t10 .r-section-title::after { background: #000; opacity: 1; height: 2px; }
  .t10 .skill-item { display: inline-block; padding: 3px 10px; background: #000; color: white; margin: 3px 3px 3px 0; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  
  /* ============ LOADING OVERLAY ============ */
  .loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    gap: 18px;
    backdrop-filter: blur(4px);
  }
  .loading.active { display: flex; }
  .spinner {
    width: 54px; height: 54px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #10b981;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-size: 14px; font-weight: 500; letter-spacing: 0.3px; }
  .loading small { font-size: 11px; color: #94a3b8; }
  
  /* Mobile toggle */
  .mobile-toggle { display: none; }
  @media (max-width: 900px) {
    .mobile-toggle {
      display: inline-flex;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(16,185,129,0.4);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1><span>📄</span> Professional Resume Builder</h1>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="loadSample()">📝 Sample</button>
    <button class="btn btn-primary" id="downloadBtn" onclick="downloadPDF()">📥 Download PDF</button>
  </div>
</div>

<div class="main-layout">
  <!-- LEFT: FORM -->
  <div class="panel" id="panel">
    <div class="section-label">Choose Template</div>
    <div class="templates-grid" id="templatesGrid">
      <div class="template-btn active" data-t="1">Executive</div>
      <div class="template-btn" data-t="2">Modern</div>
      <div class="template-btn" data-t="3">Elegant</div>
      <div class="template-btn" data-t="4">Sidebar</div>
      <div class="template-btn" data-t="5">Crimson</div>
      <div class="template-btn" data-t="6">Violet</div>
      <div class="template-btn" data-t="7">Minimal</div>
      <div class="template-btn" data-t="8">Amber</div>
      <div class="template-btn" data-t="9">Teal</div>
      <div class="template-btn" data-t="10">Bold</div>
    </div>
    
    <div class="section-label">Personal Info</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" value="Rahul Sharma">
    </div>
    <div class="form-group">
      <label>Job Title</label>
      <input type="text" id="role" value="Full Stack Developer">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" value="rahul.sharma@email.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="phone" value="+91 98765 43210">
      </div>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" id="address" value="Mumbai, India">
    </div>
    
    <div class="section-label">Summary</div>
    <div class="form-group">
      <textarea id="summary">Passionate Full Stack Developer with 4+ years of experience building scalable web applications. Expertise in React, Node.js, and cloud technologies.</textarea>
    </div>
    
    <div class="section-label">Experience</div>
    <div class="form-group">
      <textarea id="experience" style="min-height:120px;">TechCorp Pvt Ltd | Senior Developer | 2022 - Present
- Led development of 5+ enterprise web applications used by 50K+ users
- Improved application performance by 40% through optimization
- Mentored junior developers and conducted code reviews

InnovateX Solutions | Developer | 2020 - 2022
- Built RESTful APIs serving 1M+ requests daily
- Collaborated with cross-functional teams on product features</textarea>
    </div>
    
    <div class="section-label">Education</div>
    <div class="form-group">
      <textarea id="education" style="min-height:80px;">B.Tech in Computer Science | IIT Delhi | 2016 - 2020
- CGPA: 8.7/10
- Head of Coding Club</textarea>
    </div>
    
    <div class="section-label">Skills</div>
    <div class="form-group">
      <input type="text" id="skills" value="JavaScript, React, Node.js, Python, MongoDB, PostgreSQL, AWS, Docker, Git">
    </div>
    
    <div class="section-label">Projects</div>
    <div class="form-group">
      <textarea id="projects" style="min-height:90px;">E-commerce Platform - MERN stack app with 10K+ active users
- Implemented payment gateway and order tracking
- Reduced load time by 60% using code splitting

Chat Application - Real-time messaging with Socket.io
- Supports 500+ concurrent users
- End-to-end encryption implemented</textarea>
    </div>
    
    <div class="section-label">Languages</div>
    <div class="form-group">
      <input type="text" id="languages" value="English (Fluent), Hindi (Native), Marathi (Conversational)">
    </div>
  </div>
  
  <!-- RIGHT: LIVE PREVIEW -->
  <div class="preview-area" id="previewArea">
    <div id="resumePreview"></div>
  </div>
</div>

<!-- Mobile toggle button -->
<button class="mobile-toggle" onclick="togglePanel()">✏️</button>

<!-- Loading overlay -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Generating your PDF...</p>
  <small>Please wait a moment</small>
</div>

<script>
  var currentTemplate = 1;

  /* ============ TEMPLATE BUTTONS ============ */
  function initTemplateButtons() {
    var btns = document.querySelectorAll('.template-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function() {
        var all = document.querySelectorAll('.template-btn');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
        this.classList.add('active');
        currentTemplate = parseInt(this.getAttribute('data-t'), 10);
        render();
      });
    }
  }

  /* ============ LIVE PREVIEW ============ */
  function initLivePreview() {
    var inputs = document.querySelectorAll('.panel input, .panel textarea');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', debounce(render, 120));
    }
  }

  function debounce(fn, wait) {
    var t;
    return function() {
      var ctx = this, args = arguments;
      clearTimeout(t);
      t = setTimeout(function() { fn.apply(ctx, args); }, wait);
    };
  }

  /* ============ HELPERS ============ */
  function val(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return fallback;
    var v = (el.value || '').trim();
    return v || fallback;
  }

  function getData() {
    return {

    };
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatMultiline(text) {
    if (!text) return '';
    var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
    var html = '';
    var inList = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.charAt(0) === '-' || line.charAt(0) === '•') {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + escapeHtml(line.substring(1).trim()) + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p><strong>' + escapeHtml(line) + '</strong></p>';
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function formatSkills(skills) {
    if (!skills) return '';
    return skills.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; })
      .map(function(s) { return '<span class="skill-item">' + escapeHtml(s) + '</span>'; }).join('');
  }

  /* ============ DOWNLOAD PDF (html2pdf method) ============ */
  function downloadPDF() {
    var element = document.getElementById('resumePreview');
    var name = (document.getElementById('name').value || 'Resume').trim().replace(/[^a-zA-Z0-9 ]/g, '');
    var filename = (name || 'Resume').replace(/\s+/g, '_') + '_Resume.pdf';
    var loading = document.getElementById('loading');
    var btn = document.getElementById('downloadBtn');

    if (typeof html2pdf === 'undefined') {
      alert('PDF library not loaded. Please check your internet connection and refresh the page.');
      return;
    }

    loading.classList.add('active');
    btn.disabled = true;

    var opt = {
      margin: 0,
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 3,
        useCORS: true,
        letterRendering: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        scrollX: 0,
        scrollY: 0,
        windowWidth: element.scrollWidth,
        windowHeight: element.scrollHeight
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    // Small delay to ensure fonts are loaded
    setTimeout(function() {
      html2pdf().set(opt).from(element).save().then(function() {
        loading.classList.remove('active');
        btn.disabled = false;
      }).catch(function(err) {
        console.error('PDF error:', err);
        loading.classList.remove('active');
        btn.disabled = false;
        alert('PDF generation failed. Please try again.\n\nError: ' + err.message);
      });
    }, 400);
  }
